<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="sackBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="almondGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="nutShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="242" rx="140" ry="24" fill="#000000" opacity="0.08"/>

  <g filter="url(#nutShadow)">
    <!-- Leaves in the back -->
    <path d="M120 130 Q100 80 135 60 Q150 100 120 130 Z" fill="url(#leafGreen)"/>
    <path d="M140 120 Q120 70 160 55 Q170 95 140 120 Z" fill="#166534"/>

    <!-- Center Burlap Sack -->
    <!-- Sack Body -->
    <path d="M190 115 L260 115 Q275 160 270 215 Q230 225 180 215 Q175 160 190 115 Z" fill="url(#sackBrown)"/>
    <!-- Folded Rim -->
    <ellipse cx="225" cy="115" rx="38" ry="14" fill="#D97706"/>
    <ellipse cx="225" cy="115" rx="34" ry="10" fill="#92400E"/>
    <!-- Spices / Powder in Sack Top -->
    <path d="M195 115 Q225 90 255 115 Z" fill="#DC2626"/>

    <!-- Mound of Almonds & Walnuts (Left) -->
    <!-- Nuts Heap -->
    <ellipse cx="140" cy="215" rx="16" ry="9" transform="rotate(-15 140 215)" fill="url(#almondGold)"/>
    <ellipse cx="162" cy="216" rx="15" ry="8" transform="rotate(20 162 216)" fill="url(#almondGold)"/>
    <ellipse cx="125" cy="218" rx="14" ry="8" transform="rotate(-35 125 218)" fill="url(#almondGold)"/>
    <ellipse cx="145" cy="204" rx="16" ry="9" transform="rotate(10 145 204)" fill="url(#almondGold)"/>
    <ellipse cx="132" cy="195" rx="15" ry="8" transform="rotate(-20 132 195)" fill="url(#almondGold)"/>
    <ellipse cx="152" cy="190" rx="14" ry="8" transform="rotate(25 152 190)" fill="url(#almondGold)"/>
    <ellipse cx="140" cy="180" rx="15" ry="8" transform="rotate(-5 140 180)" fill="url(#almondGold)"/>

    <!-- Small Snack Package / Jar (Right) -->
    <rect x="255" y="165" width="45" height="52" rx="10" fill="#FFFFFF"/>
    <rect x="255" y="180" width="45" height="25" fill="#22C55E"/>
    <circle cx="277" cy="192" r="7" fill="#DC2626"/>
    <!-- Green Lid -->
    <rect x="252" y="158" width="51" height="10" rx="3" fill="#15803D"/>

    <!-- Foreground scattered roasted nuts -->
    <ellipse cx="175" cy="228" rx="13" ry="7" transform="rotate(12 175 228)" fill="url(#almondGold)"/>
    <ellipse cx="195" cy="230" rx="14" ry="7" transform="rotate(-18 195 230)" fill="url(#almondGold)"/>
  </g>
</svg>
